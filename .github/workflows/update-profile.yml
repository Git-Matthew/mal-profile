# Rebuilds the MyAnimeList "About Me" image with live stats and publishes it to the `live` branch.
# MAL's About Me points at the permanent link:
#   https://raw.githubusercontent.com/<owner>/<repo>/live/mal_profile.png
# Runs every day, when you press "Run workflow" (Actions tab), and whenever config.json / the design changes.
# Needs one repo secret: MAL_USERNAME (Settings > Secrets and variables > Actions).
name: Update MAL profile image

on:
  schedule:
    - cron: "23 9 * * *"   # every day at 09:23 UTC = 3:23 am in Mérida
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.json", "build.py", "template/**", "assets/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install -r requirements.txt

      - name: Build the image (live stats + cover art from MAL)
        env:
          MAL_USERNAME: ${{ secrets.MAL_USERNAME }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python build.py --no-archive

      - name: Publish to the live branch (always one single commit, so the repo never grows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="$(python -c "import json; print(json.load(open('config.json', encoding='utf-8'))['output']['basename'])")"
          mkdir -p /tmp/live
          cp "output/$NAME.png" data/stats.json /tmp/live/
          cd /tmp/live
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Profile image $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
          echo "Published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live/$NAME.png"
