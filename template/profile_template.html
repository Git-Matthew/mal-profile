<!doctype html>
<!--
  MAL Profile Kit — design template.
  Filled in by build.py from config.json (every dollar-brace name below is a placeholder). Don't add other dollar signs.
  Canvas: 798px wide (MAL clamps About Me images to 798px), must stay <= 1000px tall (MAL's "Read More" fold).
  With output.fill_to_max_height in config.json, build.py sizes the posters so the image is exactly that tall.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
${FONT_FACES}
  :root{
    --ink:${INK}; --sblue:${BLUE}; --gold:${GOLD}; --green:${GREEN};
    --paper:#ffffff; --card:#eef1f6; --line:#d6dce8; --mut:#707884;
    --posterH:${POSTER_H}px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ffffff}
  body{width:798px;font-family:"KitOswald",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .doc{position:relative;width:798px;background:#fff;overflow:hidden;border:2px solid var(--ink)}
  .doc::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 1px,transparent 1px 3px)}

  /* ---------- header ---------- */
  .topedge{height:5px;background:var(--gold)}
  .top{position:relative;z-index:2;height:58px;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:0 16px}
  .top::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:repeating-linear-gradient(90deg,var(--gold) 0 26px,transparent 26px 40px)}
  .crest{width:38px;height:38px;flex:none;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
    background:#fff;transform:rotate(45deg)}       /* white diamond, MAL-blue kanji */
  /* 神: 25% bigger than the original 18px (Oct 4, 2026); the nudge puts the ink dead centre, ~4px clear of the gold border */
  .crest span{transform:rotate(-45deg) translate(.5px,-1.6px);font-family:"KitJP";font-weight:900;color:var(--sblue);font-size:22.5px}
  .top .t1{font-family:"KitAnton";font-size:20px;letter-spacing:.14em;line-height:1}
  .top .t2{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:"KitMono";font-size:11px;color:#9aa2b1;letter-spacing:.2em}
  .top .t2 .sep{color:#5d6472}
  .top .t2 .st{color:var(--gold);letter-spacing:.12em;font-size:11px}

  /* ---------- hero ---------- */
  .hero{position:relative;height:${HERO_H}px;overflow:hidden;background:#ffffff}
  .hero .grid{position:absolute;inset:0;z-index:0;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,#000 0 42%,transparent 70%)}
  .hbody{position:relative;z-index:7;height:100%;padding:0 28px;display:flex;flex-direction:column;justify-content:center}
  .name{font-family:"KitAnton";font-size:78px;line-height:.86;letter-spacing:.005em;color:var(--ink)}
  .underbar{height:7px;width:232px;margin-top:8px;background:var(--ink);position:relative}
  .underbar::after{content:"";position:absolute;right:-1px;top:0;height:7px;width:46px;background:var(--sblue)}
  .title{display:flex;align-items:baseline;gap:10px;margin-top:14px}
  /* Japanese + English pairs: sizes and 1-2px nudges are tuned so both show the SAME visible height
     (measured on the render; Matthew's rule). Re-check with tools/measure_pairs.py after changing fonts/sizes. */
  .title .jpn{font-family:"KitJP";font-weight:900;font-size:24px;color:var(--gold);line-height:1}
  .title .en{font-family:"KitOswald";font-weight:500;font-size:28px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;position:relative;top:2px}
  .chips{display:flex;gap:8px;margin-top:16px}
  .chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--ink);padding:5px 11px;font-family:"KitMono";
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:#fff}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.22)}
  .chip .star{color:var(--gold);font-size:12px;letter-spacing:0}

  /* name tag: covers the spot where the character art's hair runs into the image edge */
  .nameplate{position:absolute;width:30px;bottom:0;z-index:6;background:#fff;border:2px solid var(--ink);border-bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
  .nameplate::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
  .nameplate .st{color:var(--gold);font-size:10px;line-height:1}
  .nameplate .nm{writing-mode:vertical-rl;font-family:"KitJP";font-weight:900;font-size:14px;letter-spacing:.32em;color:var(--gold)}

  /* ---------- character layer: whole image rides over the header; clipped only where the favorites bar starts. No effects. ---------- */
  .satlayer{position:absolute;left:0;top:0;width:100%;height:${BAND_TOP}px;z-index:5;pointer-events:none;clip-path:${CLIP}}
  .satlayer img{position:absolute;right:${CHAR_RIGHT}px;top:${CHAR_TOP}px;height:${CHAR_H}px;width:auto;display:block}

  /* ---------- favorites bar ---------- */
  .band{display:flex;align-items:stretch;background:var(--ink);color:#fff}
  .band .flag{background:var(--gold);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);display:flex;align-items:center;padding:0 12px;font-family:"KitJP";font-weight:900;font-size:17.5px}
  .band .lbl{display:flex;align-items:center;font-family:"KitAnton";font-size:19px;letter-spacing:.1em;padding:9px 14px;position:relative;top:1px}

  .works{padding:16px 24px 0}
  .rowlabel{display:flex;align-items:center;gap:9px;font-family:"KitMono";font-size:11px;color:var(--ink);letter-spacing:.12em;text-transform:uppercase;margin:4px 0 10px}
  .rowlabel .ar{color:var(--sblue);font-size:13px}
  .rowlabel .en2{font-family:"KitAnton";font-size:15px;letter-spacing:.1em;position:relative;top:1.5px}
  .rowlabel .jp2{font-family:"KitJP";font-weight:900;color:var(--mut);font-size:13.5px}
  .rowlabel .ln{flex:1;height:1px;background:var(--line)}

  .row{display:flex;gap:11.5px}           /* 5 x 140px + 4 gaps = the full 746px row */
  .card{width:140px}
  .pw{position:relative;width:140px;height:var(--posterH);border:2px solid var(--ink);background:var(--card);overflow:hidden;box-shadow:3px 3px 0 rgba(20,20,26,.13)}
  .pw img{width:100%;height:100%;object-fit:cover;display:block}
  .rk{position:absolute;top:0;left:0;background:var(--gold);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);font-family:"KitAnton";font-size:15px;line-height:1;padding:4px 8px 3px;z-index:2}
  .pw .sheen{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 30%,transparent 72%,rgba(0,0,0,.28))}
  .cap{margin-top:6px;font-family:"KitMono";font-size:9.5px;line-height:1.3;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;
    width:140px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* manga: 1-3 titles -> cards (same size as the anime ones) + stats card side by side ("side" mode) */
  .mrow{display:flex;gap:11.5px;align-items:stretch}
  .statcard{flex:1;border:2px solid var(--gold);background:linear-gradient(180deg,#191922,#121219);color:#fff;position:relative;overflow:hidden;
    padding:12px 15px 10px;display:flex;flex-direction:column}
  .statcard::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border:14px solid rgba(215,167,54,.09);border-radius:50%}
  .statcard .sh{font-family:"KitAnton";font-size:15px;letter-spacing:.12em;color:var(--gold)}
  .statcard .stars{font-size:18px;color:var(--gold);letter-spacing:3px;margin:3px 0 4px}
  .srows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
  .srow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed rgba(215,167,54,.30);padding:4px 0}
  .srow:last-child{border-bottom:0}
  .srow .k{font-family:"KitMono";font-size:10px;color:#9aa2b1;letter-spacing:.08em}
  .srow .v{font-family:"KitAnton";font-size:17px}
  .srow .v small{font-family:"KitOswald";font-size:10px;color:#9aa2b1;font-weight:400;margin-left:3px}

  /* manga: 4-5 titles -> full row + stats strip underneath ("full" mode) */
  .statstrip{margin-top:12px;display:flex;align-items:center;gap:16px;border:2px solid var(--gold);background:linear-gradient(180deg,#191922,#121219);color:#fff;padding:8px 16px}
  .statstrip .sh{font-family:"KitAnton";font-size:15px;letter-spacing:.12em;color:var(--gold)}
  .statstrip .stars{color:var(--gold);font-size:13px;letter-spacing:2px}
  .statstrip .sitems{flex:1;display:flex;justify-content:space-evenly;align-items:baseline}
  .statstrip .it{display:flex;align-items:baseline;gap:8px}
  .statstrip .it .k{font-family:"KitMono";font-size:10px;color:#9aa2b1;letter-spacing:.08em}
  .statstrip .it .v{font-family:"KitAnton";font-size:17px}
  .statstrip .it .v small{font-family:"KitOswald";font-size:10px;color:#9aa2b1;font-weight:400;margin-left:3px}

  /* ---------- footer ---------- */
  .foot{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--ink);color:#fff;padding:10px 16px 9px;margin-top:12px;position:relative}
  .foot::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 26px,transparent 26px 40px)}
  .foot .jpq{font-family:"KitJP";font-weight:900;font-size:14px;line-height:1;color:#fff}
  /* English capitals sized to LOOK as tall as the Japanese (about the kana height); caps as tall as the kanji looked bigger (Oct 4, 2026) */
  .foot .enq{font-family:"KitMono";font-size:16px;line-height:1;color:var(--gold);letter-spacing:.16em;position:relative;top:1px}

  /* ---------- fill mode (config output.fill_to_max_height): the card is exactly the max height; build.py sizes
     the posters to fill it and any sub-pixel leftover sits just above the footer ---------- */
  body.fill .doc{height:${DOC_H}px;display:flex;flex-direction:column}
  body.fill .doc>*{flex-shrink:0}
  body.fill .works{flex-grow:1}

  /* ---------- white ("light") versions, switched per piece in config.json > theme ----------
     White background + black text; gold accents stay gold. A white favorites bar gets black lines top/bottom
     so the character's clip edge and the name tag still sit on a line. */
  body.hdr-light .top{background:#fff;color:var(--ink)}
  body.hdr-light .crest{background:#fff}
  body.hdr-light .top .t2{color:var(--mut)}
  body.hdr-light .top .t2 .sep{color:#b9bfca}
  body.band-light .band{background:#fff;color:var(--ink);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  /* white stats box: FLAT white (z-index lifts it above the page's faint scanline texture), black border,
     bigger text so it doesn't get lost next to the covers */
  body.stats-light .statcard,body.stats-light .statstrip{position:relative;z-index:41;background:#fff;color:var(--ink);border-color:var(--ink)}
  body.stats-light .statcard{padding:13px 17px 11px}
  body.stats-light .statcard::before{border-color:rgba(215,167,54,.09)}
  body.stats-light .statcard .sh{font-size:28px;line-height:1.1;color:var(--ink)}
  body.stats-light .statcard .stars{font-size:20px;letter-spacing:4px;line-height:1.15;margin:2px 0 0}
  body.stats-light .srow{border-bottom-color:rgba(215,167,54,.55);padding:6px 0}
  body.stats-light .srow .k{font-size:15px}
  body.stats-light .srow .v{font-size:26px;line-height:1}
  body.stats-light .srow .v small{font-size:13px}
  body.stats-light .statstrip .sh{font-size:23px;color:var(--ink)}
  body.stats-light .statstrip .stars{font-size:16px}
  body.stats-light .statstrip .it .k{font-size:13px;letter-spacing:.05em}
  body.stats-light .statstrip .it .v{font-size:22px;line-height:1}
  body.stats-light .statstrip .it .v small{font-size:12px}
  body.stats-light .srow .k,body.stats-light .statstrip .it .k,
  body.stats-light .srow .v small,body.stats-light .statstrip .it .v small{color:var(--mut)}
  body.stats-light.stats-ink .srow .k,body.stats-light.stats-ink .statstrip .it .k,
  body.stats-light.stats-ink .srow .v small,body.stats-light.stats-ink .statstrip .it .v small{color:var(--ink)}
  body.caps-ink .cap{color:var(--ink)}
  body.foot-light .foot{background:#fff;color:var(--ink)}
  body.foot-light .foot .jpq{color:var(--ink)}
</style></head>
<body class="mode-${MODE}${THEME_CLASSES}">
  <div class="doc">
    <div class="topedge"></div>
    <div class="top">
      <div class="crest"><span>${CREST}</span></div>
      <div>
        <div class="t1">${HEADER_TITLE}</div>
        <div class="t2"><span>${HEADER_NUMBER}</span>${HEADER_STARS_HTML}</div>
      </div>
    </div>

    <div class="hero">
      <div class="grid"></div>
${NAMEPLATE_HTML}
      <div class="hbody">
        <div class="name">${DISPLAY_NAME}</div>
        <div class="underbar"></div>
        <div class="title"><span class="jpn">${TAGLINE_JP}</span><span class="en">${TAGLINE_EN}</span></div>
        <div class="chips">
${CHIPS_HTML}
        </div>
      </div>
    </div>

    <div class="satlayer"><img src="${CHAR_SRC}" alt=""></div>

    <div class="band">
      <div class="flag">${FLAG_JP}</div>
      <div class="lbl">${FAV_TITLE}</div>
    </div>

    <div class="works">
      <div class="rowlabel"><span class="ar">▸</span> <span class="en2">${ANIME_LABEL}</span> <span class="jp2">${ANIME_LABEL_JP}</span><span class="ln"></span></div>
      <div class="row">
${ANIME_CARDS}
      </div>

      <div class="rowlabel" style="margin-top:16px"><span class="ar">▸</span> <span class="en2">${MANGA_LABEL}</span> <span class="jp2">${MANGA_LABEL_JP}</span><span class="ln"></span></div>
${MANGA_BLOCK}
    </div>

    <div class="foot">
      <span class="jpq">${QUOTE_JP}</span><span class="enq">${QUOTE_EN}</span>
    </div>
  </div>
</body></html>
